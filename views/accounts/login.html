<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CodeGuard AI</title>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Clean Auth CSS -->
    <link rel="stylesheet" href="/static/css/auth.css">

    <!-- Auth JS Controller -->
    <script src="/static/js/auth.js" defer></script>
</head>

<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="logo">
            <img src="/static/images/log_logo.png" class="auth-logo" alt="CodeGuard Logo"> 
            <p>AI Code Security Platform</p>
        </div>

        <!-- Alert Notification Box -->
        <% if (locals.error) { %>
            <div class="alert error">
                <p><%= error %></p>
            </div>
        <% } %>

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" placeholder="Enter username" required>
            </div>

            <div class="form-group">
                <label for="id_password">Password</label>
                <div class="password-wrapper">
                    <input type="password" name="password" id="id_password" placeholder="Enter password" required>
                    <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
                </div>
            </div>

            <button class="auth-btn" type="submit">
                Login
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account?
            <a href="/register">Register</a>
        </div>
    </div>
</div>

<script>
// Clean localStorage if logout occurred
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('logout') === 'true') {
    localStorage.removeItem('auth_id');
    const cleanUrl = new URL(window.location.href);
    cleanUrl.searchParams.delete('logout');
    window.history.replaceState({}, document.title, cleanUrl.pathname + cleanUrl.search);
}
</script>
</body>
</html>
